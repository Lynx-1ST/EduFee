name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore 26K1_DotNet.slnx

      - name: Build Release
        run: dotnet build 26K1_DotNet.slnx -c Release --no-restore

      - name: Run regression suite
        run: dotnet run --project 26K1_DotNet.RegressionTests -c Release --no-build

      - name: Run application self-test
        run: dotnet run --project 26K1_DotNet -c Release --no-build -- --test
